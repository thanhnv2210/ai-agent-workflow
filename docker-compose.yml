services:
  ai-service:
    build: ./ai-service
    ports:
      - "8013:8013"
    env_file:
      - ./ai-service/.env.local
    environment:
      - APP_ENV=local
    command: uvicorn app.main:app --host 0.0.0.0 --port 8013 --reload
    volumes:
      - ./ai-service:/app

  frontend:
    build: ./frontend
    ports:
      - "3013:3013"
    environment:
      - VITE_API_URL=http://localhost:8011
    depends_on:
      - ai-service
