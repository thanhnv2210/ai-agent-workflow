<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <radialGradient id="n1" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="n2" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="48" height="48" rx="10" fill="#0f0720"/>

  <!-- Edges -->
  <line x1="20" y1="13" x2="14" y2="20" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="13" x2="34" y2="20" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="28" x2="20" y2="35" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="28" x2="28" y2="35" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>

  <!-- Top node (start) -->
  <circle cx="24" cy="8"  r="6.5" fill="url(#n1)"/>

  <!-- Middle nodes (branches) -->
  <circle cx="10" cy="24" r="5.5" fill="url(#n2)"/>
  <circle cx="38" cy="24" r="5.5" fill="url(#n2)"/>

  <!-- Bottom node (end) -->
  <circle cx="24" cy="40" r="6.5" fill="url(#n1)"/>
</svg>
